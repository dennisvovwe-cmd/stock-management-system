<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejisco - Products</title>
<style>
  :root {
    --navy: #1b2a6b;
    --blue: #2f3bd6;
    --red: #e8352f;
    --green: #1a9d5a;
    --muted: #9aa1b4;
    --border: #e3e5ee;
    --bg: #f6f7fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: #1f2547;
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  header img { height: 36px; }
  .user-box { display: flex; align-items: center; gap: 14px; font-size: 14px; }
  a.back-link { color: var(--blue); text-decoration: none; font-size: 14px; }
  button.logout {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    cursor: pointer;
  }
  main { max-width: 1000px; margin: 24px auto; padding: 0 20px 60px; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  h2 { margin: 0; }
  input.search {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    width: 240px;
    max-width: 100%;
  }
  button.primary {
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .panel {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  .actions button {
    border: none;
    background: none;
    cursor: pointer;
    font-size: 13px;
    margin-right: 10px;
    padding: 0;
  }
  .actions .edit { color: var(--blue); }
  .actions .delete { color: var(--red); }
  .empty { color: var(--muted); font-size: 14px; padding: 20px 0; text-align: center; }

  /* Modal */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 25, 50, 0.4);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 14px;
    padding: 24px;
    width: 100%;
    max-width: 440px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h3 { margin-top: 0; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 14px;
  }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .modal-actions button { flex: 1; padding: 11px; border-radius: 8px; border: none; font-size: 14px; cursor: pointer; }
  .modal-actions .cancel { background: var(--bg); color: #1f2547; }
  .modal-actions .save { background: var(--blue); color: #fff; font-weight: 600; }
  #formMessage { font-size: 13px; color: var(--red); margin-bottom: 10px; min-height: 16px; }
</style>
</head>
<body>

<header>
  <img src="ChatGPT Image Sep 22, 2026, 10_04_10 PM 1.svg" alt="Ejisco">
  <div class="user-box">
    <a href="/dashboard.html" class="back-link">← Dashboard</a>
    <span id="userName"></span>
    <button class="logout" onclick="logout()">Log out</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <h2>Products</h2>
    <div style="display:flex; gap:10px; flex-wrap: wrap;">
      <input type="text" class="search" id="searchBox" placeholder="Search products..." oninput="renderTable()">
      <button class="primary" id="addBtn" style="display:none;" onclick="openAddModal()">+ Add Product</button>
    </div>
  </div>

  <div class="panel">
    <div id="tableContainer" class="empty">Loading...</div>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Add Product</h3>
    <div id="formMessage"></div>
    <label>Name</label>
    <input type="text" id="f_name">

    <label>Description</label>
    <input type="text" id="f_description">

    <div class="field-row">
      <div>
        <label>Category</label>
        <input type="text" id="f_category">
      </div>
      <div>
        <label>Unit type</label>
        <input type="text" id="f_unit_type" placeholder="piece, meter, box...">
      </div>
    </div>

    <div class="field-row">
      <div>
        <label>Cost price</label>
        <input type="number" step="0.01" id="f_cost_price">
      </div>
      <div>
        <label>Selling price</label>
        <input type="number" step="0.01" id="f_selling_price">
      </div>
    </div>

    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">Cancel</button>
      <button class="save" id="saveBtn" onclick="saveProduct()">Save</button>
    </div>
  </div>
</div>

<script>
  const token = localStorage.getItem('token');
  const role = localStorage.getItem('role');
  if (!token) window.location.href = '/login.html';
  document.getElementById('userName').textContent = localStorage.getItem('name') || '';

  function logout() {
    localStorage.clear();
    window.location.href = '/login.html';
  }

  async function api(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + token,
        ...(options.headers || {})
      }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  let products = [];
  let editingId = null;
  const isAccountant = role === 'accountant';

  function fmt(n) {
    return Number(n).toLocaleString();
  }

  async function loadProducts() {
    try {
      products = await api('/products');
      renderTable();
    } catch (e) {
      document.getElementById('tableContainer').textContent = e.message;
    }
  }

  function renderTable() {
    const search = document.getElementById('searchBox').value.toLowerCase();
    const filtered = products.filter(p =>
      p.name.toLowerCase().includes(search) ||
      (p.category || '').toLowerCase().includes(search)
    );

    if (filtered.length === 0) {
      document.getElementById('tableContainer').innerHTML = '<div class="empty">No products found.</div>';
      return;
    }

    const priceHeaders = isAccountant ? '<th>Cost</th><th>Selling</th>' : '';
    const actionsHeader = isAccountant ? '<th></th>' : '';

    const rows = filtered.map(p => {
      const priceCells = isAccountant
        ? `<td>${p.cost_price != null ? fmt(p.cost_price) : '-'}</td><td>${p.selling_price != null ? fmt(p.selling_price) : '-'}</td>`
        : '';
      const actionCells = isAccountant
        ? `<td class="actions">
             <button class="edit" onclick="openEditModal(${p.id})">Edit</button>
             <button class="delete" onclick="deleteProduct(${p.id})">Delete</button>
           </td>`
        : '';
      return `<tr>
        <td>${p.name}</td>
        <td>${p.category || '-'}</td>
        <td>${p.unit_type || '-'}</td>
        <td>${p.description || '-'}</td>
        ${priceCells}
        ${actionCells}
      </tr>`;
    }).join('');

    document.getElementById('tableContainer').innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Name</th><th>Category</th><th>Unit</th><th>Description</th>
            ${priceHeaders}
            ${actionsHeader}
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  function openAddModal() {
    editingId = null;
    document.getElementById('modalTitle').textContent = 'Add Product';
    document.getElementById('f_name').value = '';
    document.getElementById('f_description').value = '';
    document.getElementById('f_category').value = '';
    document.getElementById('f_unit_type').value = '';
    document.getElementById('f_cost_price').value = '';
    document.getElementById('f_selling_price').value = '';
    document.getElementById('formMessage').textContent = '';
    document.getElementById('overlay').classList.add('open');
  }

  function openEditModal(id) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    editingId = id;
    document.getElementById('modalTitle').textContent = 'Edit Product';
    document.getElementById('f_name').value = p.name || '';
    document.getElementById('f_description').value = p.description || '';
    document.getElementById('f_category').value = p.category || '';
    document.getElementById('f_unit_type').value = p.unit_type || '';
    document.getElementById('f_cost_price').value = p.cost_price || '';
    document.getElementById('f_selling_price').value = p.selling_price || '';
    document.getElementById('formMessage').textContent = '';
    document.getElementById('overlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('open');
  }

  async function saveProduct() {
    const messageEl = document.getElementById('formMessage');
    const saveBtn = document.getElementById('saveBtn');
    messageEl.textContent = '';

    const body = {
      name: document.getElementById('f_name').value,
      description: document.getElementById('f_description').value,
      category: document.getElementById('f_category').value,
      unit_type: document.getElementById('f_unit_type').value,
      cost_price: parseFloat(document.getElementById('f_cost_price').value) || 0,
      selling_price: parseFloat(document.getElementById('f_selling_price').value) || 0
    };

    if (!body.name) {
      messageEl.textContent = 'Product name is required.';
      return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    try {
      if (editingId) {
        await api(`/products/${editingId}`, { method: 'PUT', body: JSON.stringify(body) });
      } else {
        await api('/products', { method: 'POST', body: JSON.stringify(body) });
      }
      closeModal();
      await loadProducts();
    } catch (e) {
      messageEl.textContent = e.message;
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save';
    }
  }

  async function deleteProduct(id) {
    const p = products.find(x => x.id === id);
    if (!confirm(`Delete "${p ? p.name : 'this product'}"? This cannot be undone.`)) return;

    try {
      await api(`/products/${id}`, { method: 'DELETE' });
      await loadProducts();
    } catch (e) {
      alert(e.message);
    }
  }

  if (isAccountant) {
    document.getElementById('addBtn').style.display = 'inline-block';
  }

  loadProducts();
</script>

</body>
</html>
