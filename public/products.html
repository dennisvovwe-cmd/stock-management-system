<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejisco - Products</title>
<style>
  :root {
    --navy: #1b2a6b;
    --blue: #2f3bd6;
    --red: #e8352f;
    --green: #1a9d5a;
    --muted: #9aa1b4;
    --border: #e3e5ee;
    --bg: #f6f7fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: #1f2547;
  }

  main { max-width: 1000px; margin: 24px auto; padding: 0 20px 60px; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  h2 { margin: 0; }
  input.search {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    width: 240px;
    max-width: 100%;
  }
  button.primary {
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .panel {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  .actions button {
    border: none;
    background: none;
    cursor: pointer;
    font-size: 13px;
    margin-right: 10px;
    padding: 0;
  }
  .actions .edit { color: var(--blue); }
  .actions .delete { color: var(--red); }
  .empty { color: var(--muted); font-size: 14px; padding: 20px 0; text-align: center; }

  /* Modal */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 25, 50, 0.4);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 14px;
    padding: 24px;
    width: 100%;
    max-width: 440px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h3 { margin-top: 0; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 14px;
  }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .modal-actions button { flex: 1; padding: 11px; border-radius: 8px; border: none; font-size: 14px; cursor: pointer; }
  .modal-actions .cancel { background: var(--bg); color: #1f2547; }
  .modal-actions .save { background: var(--blue); color: #fff; font-weight: 600; }
  #formMessage { font-size: 13px; color: var(--red); margin-bottom: 10px; min-height: 16px; }
    .modal.wide { max-width: 640px; }
  .import-help { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 14px; }
  .import-help p { margin: 0 0 6px 0; }
  button.link-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
    color: var(--blue);
    font-size: 13px;
    margin-top: 4px;
  }
  .import-summary { font-size: 14px; margin: 4px 0 10px 0; }
  .problem-list {
    max-height: 180px;
    overflow-y: auto;
    font-size: 13px;
    background: #fff4e5;
    color: #8a5a0b;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 14px;
    line-height: 1.6;
  }
  .import-done {
    background: #eafaf1;
    color: #1a9d5a;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 14px;
  }
</style>
<link rel="icon" type="image/png" href="/E.png">
<link rel="stylesheet" href="side-bar.css">
</head>
<body>
<div class="shell">
  <nav id="sidebarRoot" class="sidebar"></nav>
  <div class="main-col">
    <div id="topbarRoot" class="topbar"></div>
    <main class="page-content">

  <div class="toolbar">
    <h2>Products</h2>
    <div style="display:flex; gap:10px; flex-wrap: wrap;">
      <input type="text" class="search" id="searchBox" placeholder="Search products..." oninput="renderTable()">
      <button class="primary" id="addBtn" style="display:none;" onclick="openAddModal()">+ Add Product</button>
      <button class="primary" id="importOpenBtn" style="display:none;" onclick="openImport()">Import CSV</button>
    </div>
  </div>

  <div class="panel">
    <div id="tableContainer" class="empty">Loading...</div>
  </div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Add Product</h3>
    <div id="formMessage"></div>
    <label>Name</label>
    <input type="text" id="f_name">

    <label>Description</label>
    <input type="text" id="f_description">

    <div class="field-row">
      <div>
        <label>Category</label>
        <input type="text" id="f_category">
      </div>
      <div>
        <label>Unit type</label>
        <input type="text" id="f_unit_type" placeholder="piece, meter, box...">
      </div>
    </div>

    <div class="field-row">
      <div>
        <label>Cost price</label>
        <input type="number" step="0.01" id="f_cost_price">
      </div>
      <div>
        <label>Selling price</label>
        <input type="number" step="0.01" id="f_selling_price">
      </div>
    </div>

    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">Cancel</button>
      <button class="save" id="saveBtn" onclick="saveProduct()">Save</button>
    </div>
  </div>
</div>
<div class="overlay" id="importOverlay">
  <div class="modal wide">
    <h3>Import products from CSV</h3>
    <div class="import-help">
      <p>1. Download the template and fill it in with Excel or Google Sheets, one product per row. Delete the two example rows.</p>
      <p>2. Save the file as <strong>CSV</strong>, then choose it below.</p>
      <p id="importCols"></p>
      <button type="button" class="link-btn" onclick="downloadTemplate()">Download template</button>
    </div>
    <input type="file" id="importFile" accept=".csv,text/csv" onchange="handleImportFile(this)">
    <div id="importPreview"></div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeImport()">Close</button>
      <button class="save" id="importBtn" onclick="runImport()" disabled>Import</button>
    </div>
  </div>
</div>
    </main>
  </div>
</div>
  </main>
  </div>
</div>

<script src="side-bar.js"></script>
<script src="branch-dropdown.js"></script>
<script>
  const token = localStorage.getItem('token');
  const role = localStorage.getItem('role');
   initLayout('PRODUCTS');
  async function api(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + token,
        ...(options.headers || {})
      }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  let products = [];
  let editingId = null;
   const isAccountant = role === 'accountant' || role === 'admin';

  function fmt(n) {
    return Number(n).toLocaleString();
  }

  async function loadProducts() {
    try {
      products = await api('/products');
      renderTable();
    } catch (e) {
      document.getElementById('tableContainer').textContent = e.message;
    }
  }

  function renderTable() {
    const search = document.getElementById('searchBox').value.toLowerCase();
    const filtered = products.filter(p =>
      p.name.toLowerCase().includes(search) ||
      (p.category || '').toLowerCase().includes(search)
    );

    if (filtered.length === 0) {
      document.getElementById('tableContainer').innerHTML = '<div class="empty">No products found.</div>';
      return;
    }

    const priceHeaders = isAccountant ? '<th>Cost</th><th>Selling</th>' : '<th>Selling price</th>';
    const actionsHeader = isAccountant ? '<th></th>' : '';

    const rows = filtered.map(p => {
            const priceCells = isAccountant
        ? `<td>${p.cost_price != null ? fmt(p.cost_price) : '-'}</td><td>${p.selling_price != null ? fmt(p.selling_price) : '-'}</td>`
        : `<td>${p.selling_price != null ? fmt(p.selling_price) : '-'}</td>`;
      const actionCells = isAccountant
        ? `<td class="actions">
             <button class="edit" onclick="openEditModal(${p.id})">Edit</button>
             <button class="delete" onclick="deleteProduct(${p.id})">Delete</button>
           </td>`
        : '';
      return `<tr>
        <td>${escHtml(p.name)}</td>
        <td>${escHtml(p.category || '-')}</td>
        <td>${escHtml(p.unit_type || '-')}</td>
        <td>${escHtml(p.description || '-')}</td>
        ${priceCells}
        ${actionCells}
      </tr>`;
    }).join('');

    document.getElementById('tableContainer').innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Name</th><th>Category</th><th>Unit</th><th>Description</th>
            ${priceHeaders}
            ${actionsHeader}
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  function openAddModal() {
    editingId = null;
    document.getElementById('modalTitle').textContent = 'Add Product';
    document.getElementById('f_name').value = '';
    document.getElementById('f_description').value = '';
    document.getElementById('f_category').value = '';
    document.getElementById('f_unit_type').value = '';
    document.getElementById('f_cost_price').value = '';
    document.getElementById('f_selling_price').value = '';
    document.getElementById('formMessage').textContent = '';
    document.getElementById('overlay').classList.add('open');
  }

  function openEditModal(id) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    editingId = id;
    document.getElementById('modalTitle').textContent = 'Edit Product';
    document.getElementById('f_name').value = p.name || '';
    document.getElementById('f_description').value = p.description || '';
    document.getElementById('f_category').value = p.category || '';
    document.getElementById('f_unit_type').value = p.unit_type || '';
    document.getElementById('f_cost_price').value = p.cost_price || '';
    document.getElementById('f_selling_price').value = p.selling_price || '';
    document.getElementById('formMessage').textContent = '';
    document.getElementById('overlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('open');
  }

  async function saveProduct() {
    const messageEl = document.getElementById('formMessage');
    const saveBtn = document.getElementById('saveBtn');
    messageEl.textContent = '';

    const body = {
      name: document.getElementById('f_name').value,
      description: document.getElementById('f_description').value,
      category: document.getElementById('f_category').value,
      unit_type: document.getElementById('f_unit_type').value,
      cost_price: parseFloat(document.getElementById('f_cost_price').value) || 0,
      selling_price: parseFloat(document.getElementById('f_selling_price').value) || 0
    };

    if (!body.name) {
      messageEl.textContent = 'Product name is required.';
      return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    try {
      if (editingId) {
        await api(`/products/${editingId}`, { method: 'PUT', body: JSON.stringify(body) });
      } else {
        await api('/products', { method: 'POST', body: JSON.stringify(body) });
      }
      closeModal();
      await loadProducts();
    } catch (e) {
      messageEl.textContent = e.message;
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save';
    }
  }

  async function deleteProduct(id) {
    const p = products.find(x => x.id === id);
    if (!confirm(`Delete "${p ? p.name : 'this product'}"? This cannot be undone.`)) return;

    try {
      await api(`/products/${id}`, { method: 'DELETE' });
      await loadProducts();
    } catch (e) {
      alert(e.message);
    }
  }

  if (isAccountant) {
    document.getElementById('addBtn').style.display = 'inline-block';
    document.getElementById('importOpenBtn').style.display = 'inline-block';
  }

  /* ---------- CSV import ---------- */
  const HEADER_ALIASES = {
    name: 'name', product_name: 'name', product: 'name',
    category: 'category',
    unit_type: 'unit_type', unit: 'unit_type',
    description: 'description',
    cost_price: 'cost_price', cost: 'cost_price',
    selling_price: 'selling_price', selling: 'selling_price', price: 'selling_price'
  };
  let importReady = [];

  function escHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // Reads CSV text, including quoted values, commas inside quotes, and Excel's semicolon style
  function parseCSV(text) {
    text = text.replace(/^\uFEFF/, '');
    const firstLine = text.split(/\r?\n/)[0] || '';
    const delim = firstLine.split(';').length > firstLine.split(',').length ? ';' : ',';
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else if (c === '"') inQuotes = true;
      else if (c === delim) { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c !== '\r') field += c;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(cell => cell.trim() !== ''));
  }

  // "₦1,500" -> 1500. Blank -> 0. Text -> error.
  function cleanNumber(raw) {
    const s = String(raw ?? '').trim();
    if (s === '') return { value: 0 };
    const cleaned = s.replace(/[^\d.\-]/g, '');
    const n = Number(cleaned);
    if (cleaned === '' || !Number.isFinite(n)) return { error: true };
    return { value: n };
  }

async function openImport() {
  await loadBranches();
    document.getElementById('importCols').textContent =
      'Opening stock columns: ' + BRANCHES.map(b => `stock_branch_${b.value} = ${b.name}`).join(', ') + '. Leave them blank for 0.';
    document.getElementById('importFile').value = '';
    document.getElementById('importPreview').innerHTML = '';
    document.getElementById('importBtn').disabled = true;
    document.getElementById('importBtn').textContent = 'Import';
    importReady = [];
    document.getElementById('importOverlay').classList.add('open');
  }

  function closeImport() {
    document.getElementById('importOverlay').classList.remove('open');
  }

  function downloadTemplate() {
    const branchCols = BRANCHES.map(b => 'stock_branch_' + b.value);
    const header = ['name', 'category', 'unit_type', 'description', 'cost_price', 'selling_price', ...branchCols];
    const ex1 = ['Example Socket 13A', 'Electrical', 'piece', 'Single socket', '1200', '1800', ...BRANCHES.map(() => '20')];
    const ex2 = ['Example Cable 4mm', 'Electrical', 'meter', 'Copper wire', '250', '350', ...BRANCHES.map(() => '100')];
    const csv = [header, ex1, ex2].map(r => r.join(',')).join('\r\n');
    const url = URL.createObjectURL(new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'products-template.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function handleImportFile(input) {
    const preview = document.getElementById('importPreview');
    const btn = document.getElementById('importBtn');
    importReady = [];
    btn.disabled = true;
    btn.textContent = 'Import';

    const file = input.files[0];
    if (!file) { preview.innerHTML = ''; return; }

    let rows;
    try {
      rows = parseCSV(await file.text());
    } catch (e) {
      preview.innerHTML = '<div class="problem-list">Could not read that file.</div>';
      return;
    }
    if (rows.length < 2) {
      preview.innerHTML = '<div class="problem-list">The file has no product rows.</div>';
      return;
    }
    if (rows.length - 1 > 2000) {
      preview.innerHTML = '<div class="problem-list">The file has more than 2000 rows. Split it into smaller files.</div>';
      return;
    }

    // Work out which column is which
    const headers = rows[0].map(h => h.trim().toLowerCase().replace(/[\s-]+/g, '_'));
    const colIndex = {};
    const branchCols = {};
    const ignored = [];
    headers.forEach((h, i) => {
      if (HEADER_ALIASES[h] && colIndex[HEADER_ALIASES[h]] === undefined) colIndex[HEADER_ALIASES[h]] = i;
      else if (/^stock_branch_\d+$/.test(h)) branchCols[h.replace('stock_branch_', '')] = i;
      else if (h) ignored.push(rows[0][i].trim());
    });
    if (colIndex.name === undefined) {
      preview.innerHTML = '<div class="problem-list">There is no "name" column. Use the template for the right headings.</div>';
      return;
    }

    const existingNames = new Set(products.map(p => (p.name || '').trim().toLowerCase()));
    const seenInFile = new Set();
    const problems = [];
    const ready = [];

    rows.slice(1).forEach((cells, idx) => {
      const rowNum = idx + 2;
      const get = (field) => colIndex[field] === undefined ? '' : (cells[colIndex[field]] ?? '').trim();

      const name = get('name');
      const category = get('category');
      const unit_type = get('unit_type');
      const description = get('description');
      const cost = cleanNumber(get('cost_price'));
      const selling = cleanNumber(get('selling_price'));

      const fail = (reason) => problems.push({ row: rowNum, name, reason });

      if (!name) return fail('Missing product name');
      if (name.length > 150) return fail('Name is longer than 150 characters');
      if (category.length > 100) return fail('Category is longer than 100 characters');
      if (unit_type.length > 50) return fail('Unit is longer than 50 characters');
      if (cost.error || cost.value < 0) return fail('Cost price is not a valid number');
      if (selling.error || selling.value < 0) return fail('Selling price is not a valid number');

      const key = name.toLowerCase();
      if (existingNames.has(key)) return fail('Already exists, skipped');
      if (seenInFile.has(key)) return fail('Appears twice in the file, skipped');

      const opening = {};
      for (const [bid, col] of Object.entries(branchCols)) {
        const q = cleanNumber(cells[col]);
        if (q.error || q.value < 0) return fail(`Stock for branch ${bid} is not a valid number`);
        opening[bid] = q.value;
      }

      seenInFile.add(key);
      ready.push({
        row: rowNum, name, category, unit_type, description,
        cost_price: cost.value, selling_price: selling.value, opening_stock: opening
      });
    });

    importReady = ready;

    let html = `<div class="import-summary"><strong>${ready.length}</strong> ready to import &middot; <strong>${problems.length}</strong> skipped</div>`;
    if (ignored.length) {
      html += `<div class="import-help">Ignored columns: ${escHtml(ignored.join(', '))}</div>`;
    }
    if (problems.length) {
      const shown = problems.slice(0, 30)
        .map(p => `Row ${p.row}${p.name ? ' (' + escHtml(p.name) + ')' : ''}: ${escHtml(p.reason)}`)
        .join('<br>');
      html += `<div class="problem-list">${shown}${problems.length > 30 ? `<br>...and ${problems.length - 30} more` : ''}</div>`;
    }
    preview.innerHTML = html;

    if (ready.length > 0) {
      btn.disabled = false;
      btn.textContent = `Import ${ready.length} product${ready.length === 1 ? '' : 's'}`;
    }
  }

  async function runImport() {
    const btn = document.getElementById('importBtn');
    const preview = document.getElementById('importPreview');
    const count = importReady.length;
    btn.disabled = true;
    btn.textContent = 'Importing...';

    try {
      const result = await api('/products/import', {
        method: 'POST',
        body: JSON.stringify({ rows: importReady })
      });
      let html = `<div class="import-done">Imported ${result.imported} product${result.imported === 1 ? '' : 's'}.</div>`;
      if (result.skipped.length) {
        html += `<div class="problem-list">The server skipped:<br>${result.skipped
          .map(s => `Row ${s.row}${s.name ? ' (' + escHtml(s.name) + ')' : ''}: ${escHtml(s.reason)}`)
          .join('<br>')}</div>`;
      }
      preview.innerHTML = html;
      document.getElementById('importFile').value = '';
      importReady = [];
      btn.textContent = 'Import';
      await loadProducts();
    } catch (e) {
      preview.innerHTML = `<div class="problem-list">${escHtml(e.message)}</div>`;
      btn.disabled = false;
      btn.textContent = `Import ${count} product${count === 1 ? '' : 's'}`;
    }
  }
  
  loadBranches();
  loadProducts();
</script>

</body>
</html>
