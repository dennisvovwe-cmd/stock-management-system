<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejisco - Staff</title>
<style>
  :root {
    --navy: #1b2a6b;
    --blue: #2f3bd6;
    --red: #e8352f;
    --green: #1a9d5a;
    --muted: #9aa1b4;
    --border: #e3e5ee;
    --bg: #f6f7fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: #1f2547;
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  header img { height: 36px; }
  .user-box { display: flex; align-items: center; gap: 14px; font-size: 14px; }
  a.back-link { color: var(--blue); text-decoration: none; font-size: 14px; }
  button.logout {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    cursor: pointer;
  }
  main { max-width: 560px; margin: 24px auto; padding: 0 20px 60px; }
  h2 { margin-top: 0; }

  .panel {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input, select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    color: #1f2547;
  }
  .field { margin-bottom: 16px; }

  button.submit {
    width: 100%;
    padding: 15px;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button.submit:disabled { opacity: 0.6; cursor: default; }

  #message { margin-top: 14px; text-align: center; font-size: 14px; }
  #message.error { color: var(--red); }
  #message.success { color: var(--green); }

  .locked {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
  }
</style>
</head>
<body>

<header>
  <img src="ChatGPT Image Sep 22, 2026, 10_04_10 PM 1.svg" alt="Ejisco">
  <div class="user-box">
    <a href="/dashboard.html" class="back-link">← Dashboard</a>
    <span id="userName"></span>
    <button class="logout" onclick="logout()">Log out</button>
  </div>
</header>

<main>
  <h2>Add Staff</h2>

  <div id="content"></div>
</main>

<script>
  const token = localStorage.getItem('token');
  const role = localStorage.getItem('role');
  if (!token) window.location.href = '/login.html';
  document.getElementById('userName').textContent = localStorage.getItem('name') || '';

  function logout() {
    localStorage.clear();
    window.location.href = '/login.html';
  }

  async function api(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + token,
        ...(options.headers || {})
      }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  const content = document.getElementById('content');

  if (role !== 'accountant') {
    content.innerHTML = `<div class="panel"><div class="locked">Only the accountant can add new staff.</div></div>`;
  } else {
    content.innerHTML = `
      <div class="panel">
        <div class="field">
          <label for="f_name">Full name</label>
          <input type="text" id="f_name">
        </div>
        <div class="field">
          <label for="f_email">Email</label>
          <input type="email" id="f_email">
        </div>
        <div class="field">
          <label for="f_password">Temporary password</label>
          <input type="text" id="f_password">
        </div>
        <div class="field">
          <label for="f_role">Role</label>
          <select id="f_role">
            <option value="staff">Staff</option>
            <option value="accountant">Accountant</option>
          </select>
        </div>
        <div class="field">
          <label for="f_branch">Branch</label>
          <select id="f_branch">
            <option value="1">Branch A</option>
            <option value="2">Branch B</option>
          </select>
        </div>
        <button class="submit" id="submitBtn" onclick="createStaff()">Add Staff Member</button>
        <div id="message"></div>
      </div>
    `;
  }

  async function createStaff() {
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');
    messageEl.textContent = '';
    messageEl.className = '';

    const body = {
      name: document.getElementById('f_name').value,
      email: document.getElementById('f_email').value,
      password: document.getElementById('f_password').value,
      role: document.getElementById('f_role').value,
      branch_id: Number(document.getElementById('f_branch').value)
    };

    if (!body.name || !body.email || !body.password) {
      messageEl.textContent = 'Fill in name, email, and a password.';
      messageEl.className = 'error';
      return;
    }
    if (body.password.length < 6) {
      messageEl.textContent = 'Password should be at least 6 characters.';
      messageEl.className = 'error';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Adding...';

    try {
      const result = await api('/signup', { method: 'POST', body: JSON.stringify(body) });
      messageEl.textContent = `${result.name} added as ${result.role}. Share their email and temporary password with them.`;
      messageEl.className = 'success';
      document.getElementById('f_name').value = '';
      document.getElementById('f_email').value = '';
      document.getElementById('f_password').value = '';
    } catch (e) {
      messageEl.textContent = e.message;
      messageEl.className = 'error';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Add Staff Member';
    }
  }
</script>

</body>
</html>
