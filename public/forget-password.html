<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejisco - Forgot Password</title>
<style>
  :root {
    --navy: #1b2a6b;
    --blue: #2f3bd6;
    --red: #e8352f;
    --green: #1a9d5a;
    --text-muted: #9aa1b4;
    --border: #e3e5ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    background: #ffffff;
  }
  .brand-side {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  .brand-side img { width: 500px; max-width: 80%; height: auto; }

  .form-side {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 40px;
    height: 100vh;
    overflow: hidden;
  }
  .form-wrap { width: 100%; max-width: 420px; }

  .wordmark { display: block; width: 200px; max-width: 60%; height: auto; margin-bottom: 16px; }

  h1 { font-size: 24px; font-weight: 400; color: #192087; margin: 0 0 4px 0; }
  .subhead { font-size: 13px; color: #1f2547; margin-bottom: 18px; }
  .subhead a { color: var(--blue); text-decoration: none; font-weight: 600; }

  label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
  .field { margin-bottom: 12px; position: relative; }
  input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    color: #1f2547;
    outline: none;
  }
  input:focus { border-color: var(--blue); }

  .toggle-visibility {
    position: absolute;
    right: 12px;
    top: 26px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
  }
  .toggle-visibility img { width: 20px; height: 20px; }

  button.primary {
    width: 100%;
    padding: 13px;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }
  button.primary:disabled { opacity: 0.6; cursor: default; }

  .bottom-link { text-align: left; font-size: 13px; color: #1f2547; }
  .bottom-link a { color: var(--blue); text-decoration: none; font-weight: 600; }

  #message { min-height: 18px; font-size: 13px; margin-top: 12px; text-align: center; }
  #message.error { color: var(--red); }
  #message.success { color: var(--green); }

  @media (max-width: 860px) {
    .brand-side { display: none; }
    .form-side { padding: 24px; align-items: flex-start; }
    .form-wrap { max-width: 100%; }
    .wordmark { margin: 0 auto 28px auto; }
  }
</style>
<link rel="icon" type="image/png" href="/E.png">
</head>
<body>

  <div class="brand-side">
    <img src="E.png" alt="Ejisco logo mark">
  </div>

  <div class="form-side">
    <div class="form-wrap">
      <img src="ChatGPT Image Sep 22, 2026, 10_04_10 PM 1.svg" alt="Ejisco International Limited" class="wordmark">

      <h1>Reset your password</h1>
      <div class="subhead">Remembered it? <a href="/login.html">Log in</a></div>

      <div class="field">
        <label for="f_email">Email</label>
        <input type="email" id="f_email" placeholder="username@gmail.com">
      </div>

      <div class="field">
        <label for="f_password">New password</label>
        <input type="password" id="f_password" placeholder="••••••••">
        <button type="button" class="toggle-visibility" id="toggleBtn1">
          <img src="octicon_eye-closed-24.svg" alt="Show password" id="toggleIcon1">
        </button>
      </div>

      <div class="field">
        <label for="f_confirm">Confirm new password</label>
        <input type="password" id="f_confirm" placeholder="••••••••">
        <button type="button" class="toggle-visibility" id="toggleBtn2">
          <img src="octicon_eye-closed-24.svg" alt="Show password" id="toggleIcon2">
        </button>
      </div>

      <button class="primary" id="submitBtn" onclick="submitReset()">Reset Password</button>
      <div id="message"></div>

      <div class="bottom-link">Remembered it? <a href="/login.html">Log in</a></div>
    </div>
  </div>

<script>
  function wireToggle(btnId, iconId, inputId) {
    const btn = document.getElementById(btnId);
    const icon = document.getElementById(iconId);
    const input = document.getElementById(inputId);
    btn.addEventListener('click', () => {
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      icon.src = isHidden ? 'octicon_eye-24.svg' : 'eye.svg';
    });
  }
  wireToggle('toggleBtn1', 'toggleIcon1', 'f_password');
  wireToggle('toggleBtn2', 'toggleIcon2', 'f_confirm');

  async function submitReset() {
    const messageEl = document.getElementById('message');
    const btn = document.getElementById('submitBtn');
    messageEl.textContent = '';
    messageEl.className = '';

    const email = document.getElementById('f_email').value;
    const new_password = document.getElementById('f_password').value;
    const confirm_password = document.getElementById('f_confirm').value;

    if (!email || !new_password || !confirm_password) {
      messageEl.textContent = 'Fill in every field.';
      messageEl.className = 'error';
      return;
    }
    if (new_password !== confirm_password) {
      messageEl.textContent = 'Passwords do not match.';
      messageEl.className = 'error';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Submitting...';

    try {
      const res = await fetch('/password-reset-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, new_password, confirm_password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');

      messageEl.textContent = 'Request submitted. An admin will review it before your new password is active.';
      messageEl.className = 'success';
      document.getElementById('f_email').value = '';
      document.getElementById('f_password').value = '';
      document.getElementById('f_confirm').value = '';
    } catch (e) {
      messageEl.textContent = e.message;
      messageEl.className = 'error';
      btn.disabled = false;
      btn.textContent = 'Reset Password';
    }
  }
</script>
</body>
</html>
